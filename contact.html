<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Student Records Management System</title>
</head>

<body>

    <h1>Contact Us</h1>

    <p>
        Visit the Kibabii University website:
        <a href="https://www.kibabii.ac.ke" target="_blank">
            Kibabii University
        </a>
    </p>

    <p>
        Email us:
        <a href="mailto:info@example.com">
            info@example.com
        </a>
    </p>

    <p>
        Call us:
        <a href="tel:+254700000000">
            +254700000000
        </a>
    </p>
    <h2>Send Us a Message</h2>
    <form action="#" method="post">
        <p> <label for="name">Full Name:</label><br> <input type="text" id="name" name="name" required> </p>
        <p> <label for="email">Email Address:</label><br> <input type="email" id="email" name="email" required> </p>
        <p> <label for="subject">Subject:</label><br> <input type="text" id="subject" name="subject" required> </p>
        <p> <label for="message">Message:</label><br> <textarea id="message" name="message" rows="6" cols="40"
                required></textarea> </p>
        <p> <button type="submit">Send Message</button> <button type="reset">Clear Form</button> </p>
    </form>

    <p>
        Go back to the
        <a href="index.html">Home Page</a>.
    </p>

</body>

</html>
